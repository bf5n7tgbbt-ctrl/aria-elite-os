[project]
name = "aria-elite-os"
version = "0.1.0"
description = "Autonomous Financial Cognitive Entity — development workspace."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]

[project.scripts]
aria = "aria.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
