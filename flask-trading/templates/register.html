{% extends "base.html" %}

{% block title %}Inscription - Trading Dashboard{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <div class="auth-header">
            <h1>Créer un Compte</h1>
            <p class="auth-subtitle">Rejoignez notre plateforme de trading</p>
        </div>
        
        {% if error %}
        <div class="alert alert-error">
            <span>⚠️ {{ error }}</span>
        </div>
        {% endif %}
        
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required placeholder="Entrez votre nom d'utilisateur">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Entrez votre email">
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required placeholder="Entrez votre mot de passe">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirmer le mot de passe</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirmez votre mot de passe">
            </div>
            
            <button type="submit" class="btn btn-primary">S'inscrire</button>
        </form>
        
        <div class="auth-footer">
            <p>Vous avez déjà un compte? <a href="{{ url_for('login') }}">Connectez-vous</a></p>
        </div>
    </div>
</div>
{% endblock %}
